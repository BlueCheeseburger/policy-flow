<!--
  Just the mark: three stripes, transparent behind them.

  Square viewBox because favicons are rendered square — the mark's own box is
  272x168, so it sits centred with 52 units of clear space above and below
  rather than being stretched to fill.
-->
<svg width="272" height="272" viewBox="0 0 272 272" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="s" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#88CCFF"/>
      <stop offset="12%"  stop-color="#3388FF"/>
      <stop offset="35%"  stop-color="#4466EE"/>
      <stop offset="50%"  stop-color="#7744DD"/>
      <stop offset="65%"  stop-color="#AA44DD"/>
      <stop offset="88%"  stop-color="#CC66FF"/>
      <stop offset="100%" stop-color="#DDAAFF"/>
    </linearGradient>
  </defs>
  <g transform="translate(0 52)" stroke="url(#s)" stroke-width="48" stroke-linecap="round">
    <line x1="24"  y1="144" x2="100" y2="24"/>
    <line x1="98"  y1="144" x2="174" y2="24"/>
    <line x1="172" y1="144" x2="248" y2="24"/>
  </g>
</svg>
