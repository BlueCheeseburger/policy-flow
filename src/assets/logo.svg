<!--
  The Policy Flow mark — the same three stripes as Warroom's, because they are
  the same family of tool. Geometry is lifted verbatim from
  warroom/src/assets/warroom-logo.svg (stripes at x 144/218/292, rising 76 right
  and 120 up, 48px round-capped strokes) and translated so the mark's own
  bounding box is the viewBox, with no squircle behind it.

  The app icon keeps Warroom's neon bloom and grain filters; this one omits them
  deliberately. At 18px in a top bar a Gaussian bloom just smears the stripes
  into a lilac blob — the flat gradient reads cleanly at every size.
-->
<svg width="272" height="168" viewBox="0 0 272 168" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Policy Flow">
  <defs>
    <linearGradient id="pfStripe" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#88CCFF"/>
      <stop offset="12%"  stop-color="#3388FF"/>
      <stop offset="35%"  stop-color="#4466EE"/>
      <stop offset="50%"  stop-color="#7744DD"/>
      <stop offset="65%"  stop-color="#AA44DD"/>
      <stop offset="88%"  stop-color="#CC66FF"/>
      <stop offset="100%" stop-color="#DDAAFF"/>
    </linearGradient>
  </defs>
  <g stroke="url(#pfStripe)" stroke-width="48" stroke-linecap="round">
    <line x1="24"  y1="144" x2="100" y2="24"/>
    <line x1="98"  y1="144" x2="174" y2="24"/>
    <line x1="172" y1="144" x2="248" y2="24"/>
  </g>
</svg>
